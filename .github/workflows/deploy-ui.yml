name: Deploy UI (S3 + CloudFront)

on:
  push:
    branches: [ "main" ]
    paths:
      - "covid-cfr-ui/**"
      - ".github/workflows/deploy-ui.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: covid-cfr-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: covid-cfr-ui/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          # IMPORTANT: set this to your API GW base URL (REST API stage base)
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-2

      - name: Sync to S3
        run: |
          aws s3 sync dist "s3://${{ vars.UI_BUCKET_NAME }}/" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
